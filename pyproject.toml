[project]
name = "finance-api"
version = "0.1.0"
description = "Finance suite entry point: the cross-cell views (overview, net worth, budget vs actual) over the ten finance cells"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pyjwt[crypto]>=2.10,<3",
    # [standard] = uvloop + httptools
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "mypy>=2.4",
]

[project.scripts]
finance-api = "finance_api.server:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "BLE", "UP", "C4", "SIM", "RUF", "PIE", "PT", "RET", "ISC",
    "PERF", "LOG", "G", "FURB",
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

# Service code: mypy --strict. tests/ stays gradual (pytest injects fixtures by name).
[[tool.mypy.overrides]]
module = ["finance_api.*"]
check_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true
warn_return_any = true
